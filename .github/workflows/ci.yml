name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run integration
      - run: npm run action:smoke
      - run: npm run check:dist
      - run: npm run check:notices
      - name: GitHub Action metadata and bundled entry-point smoke
        id: action-smoke
        continue-on-error: true
        uses: ./
        with:
          consumers: invalid-without-a-full-sha
      - name: Assert expected configuration failure
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.action-smoke.outcome }}
        run: test "$ACTION_OUTCOME" = failure

  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Intentional candidate regression exits 1
        run: |
          set +e
          npm run demo
          status=$?
          set -e
          test "$status" -eq 1
      - run: npm run demo:compatible
      - run: npm run demo:preexisting
